<!DOCTYPE html>
<html lang="en" class="resume" data-theme="dark-poole">
  {% include head.html %}

  <body>
    <div class="container content">
      <header class="masthead">
        <h2 class="masthead-title">
          <a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a> 

          <nav class="nav">
            {% for nav in site.nav %}
            <small>
              <a href="{{ nav.url }}">{{ nav.title }}</a>
            </small>
            {% endfor %}
          </nav>
        </h2>
      </header>

      <main>
        <article class="page">
          <header class="resume-header">
            <h1 class="resume-name">{{ site.author.name }}</h1>
            <p class="resume-contact">
              Software Engineer
              <span class="print-only">&middot; <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></span>
              &middot; <a href="https://github.com/rsanheim">github.com/rsanheim</a>
              &middot; <a href="{{ site.author.url }}/resume">rsanheim.com/resume</a>
            </p>
          </header>
          {{ content }}
          </article>
      </main>

      <footer class="footer no-print">
        <small>
          &copy;
          <time datetime="{{ site.time | date_to_xmlschema }}"
            >{{ site.time | date: '%Y' }}</time
          >. All rights reserved.
        </small>
      </footer>
    </div>

  </body>
</html>
